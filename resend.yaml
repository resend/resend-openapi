    Inbox:
      type: object
      required:
        - object
        - id
        - name
        - email_address
        - domain_id
        - receiving_address
        - from_name
        - unread
        - drafts
        - last_received
        - created_at
      properties:
        object:
          type: string
          description: The object type. Always `inbox`.
          example: inbox
        id:
          type: string
          format: uuid
          description: The ID of the inbox.
          example: b3e2b2b6-3f0e-4c8e-9ad3-2f43a1e2c7f1
        name:
          type: string
          description: Internal name for the inbox. Recipients do not see it. Falls back to the inbox email address.
          example: Customer Support
        email_address:
          type: string
          description: The address of the inbox.
          example: support@acme.com
        domain_id:
          type: string
          format: uuid
          description: The ID of the domain that owns the address.
          example: d91cd9bd-1176-453e-8fc1-35364d380206
        receiving_address:
          type: [string, "null"]
          description: The address to forward mail to when forwarding is enabled. `null` otherwise.
          example: null
        from_name:
          type: [string, "null"]
          description: The name recipients see when mail is sent from this inbox. `null` when not set.
          example: Ada from Support
        unread:
          type: integer
          description: The number of unread threads in the inbox.
          example: 3
        drafts:
          type: integer
          description: The number of unsent drafts.
          example: 2
        last_received:
          type: [string, "null"]
          format: date-time
          description: ISO 8601 timestamp when a thread in this inbox was last active. `null` when the inbox has no threads.
          example: '2026-08-05T14:03:11.229Z'
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the inbox was created.
          example: '2026-08-01T09:12:44.512Z'
    CreateInboxOptions:
      type: object
      required:
        - email_address
      properties:
        email_address:
          type: string
          description: >-
            The inbox email address on one of your domains. The API trims and lowercases it. The part before the `@` is at most 64 characters and contains only letters, numbers, and `. _ % + -`. It cannot start or end with a dot or contain two dots in a row.
          example: support@acme.com
        name:
          type: string
          maxLength: 64
          description: Internal name for the inbox. Recipients do not see it. Max 64 characters. Defaults to `email_address`.
          example: Customer Support
        from_name:
          type: string
          maxLength: 78
          description: >-
            The name recipients see when mail is sent from this inbox. A plain name, not a `Name <email>` address. Max 78 characters. It cannot contain a colon, `<`, `>`, line breaks, or other control characters. An email address inside the name must be on a domain the team has verified for sending. An empty string leaves it unset.
          example: Ada from Support
        forwarding:
          type: boolean
          default: false
          description: >-
            When `true`, Resend provisions a receiving address so you can receive mail without adding an MX record. The address is returned in `receiving_address`.
    CreateInboxResponseSuccess:
      $ref: '#/components/schemas/Inbox'
    GetInboxResponseSuccess:
      $ref: '#/components/schemas/Inbox'
    ListInboxesResponseSuccess:
      type: object
      required:
        - object
        - has_more
        - data
      properties:
        object:
          type: string
          description: Type of the response object.
          example: list
        has_more:
          type: boolean
          description: Indicates if there are more results available.
          example: false
        data:
          type: array
          description: Array containing inbox information.
          items:
            type: object
            required:
              - id
              - name
              - email_address
              - from_name
              - unread
              - last_received
            properties:
              id:
                type: string
                format: uuid
                description: The ID of the inbox.
                example: b3e2b2b6-3f0e-4c8e-9ad3-2f43a1e2c7f1
              name:
                type: [string, "null"]
                description: Internal name for the inbox. Recipients do not see it.
                example: Customer Support
              email_address:
                type: string
                description: The address of the inbox.
                example: support@acme.com
              from_name:
                type: [string, "null"]
                description: The name recipients see when mail is sent from this inbox. `null` when not set.
                example: Ada from Support
              unread:
                type: integer
                description: The number of unread threads in the inbox.
                example: 3
              last_received:
                type: [string, "null"]
                format: date-time
                description: ISO 8601 timestamp when a thread in this inbox was last active. `null` when the inbox has no threads.
                example: '2026-08-05T14:03:11.229Z'
    UpdateInboxOptions:
      type: object
      description: Provide at least one of `name` or `from_name`.
      anyOf:
        - required:
            - name
        - required:
            - from_name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: New internal name for the inbox. Recipients do not see it. Between 1 and 64 characters after trimming.
          example: Customer Support
        from_name:
          type: string
          maxLength: 78
          description: >-
            The name recipients see when mail is sent from this inbox. A plain name, not a `Name <email>` address. Max 78 characters. It cannot contain a colon, `<`, `>`, line breaks, or other control characters. An email address inside the name must be on a domain the team has verified for sending. An empty string removes it.
          example: Ada from Support
    UpdateInboxResponseSuccess:
      type: object
      required:
        - object
        - id
      properties:
        object:
          type: string
          description: The object type.
          example: inbox
        id:
          type: string
          format: uuid
          description: The ID of the inbox.
          example: b3e2b2b6-3f0e-4c8e-9ad3-2f43a1e2c7f1
    RemoveInboxResponseSuccess:
      type: object
      required:
