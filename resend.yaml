      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInboxAgentResponseSuccess'
  /inboxes/{inbox_id}/labels:
    get:
      operationId: inboxes/list-labels
      tags:
        - Inboxes
      summary: Retrieve a list of inbox labels
      description: Returns every label on the inbox, oldest first. The list is not paginated.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInboxLabelsResponseSuccess'
    post:
      operationId: inboxes/create-label
      tags:
        - Inboxes
      summary: Create a label on an inbox
      description: >-
        A label is a named, colored tag that belongs to one inbox. An inbox can
        have at most 100 labels. Label names are unique per inbox, compared
        without case. A duplicate name or a full inbox returns a 422
        validation_error.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInboxLabelOptions'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInboxLabelResponseSuccess'
  /inboxes/{inbox_id}/labels/{label_id}:
    patch:
      operationId: inboxes/update-label
      tags:
        - Inboxes
      summary: Update an existing inbox label
      description: >-
        Renames or recolors a label. Omitted fields keep their current value. A
        new name must not match another label on the inbox, compared without
        case, or the request returns a 422 validation_error.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: label_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Label ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInboxLabelOptions'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInboxLabelResponseSuccess'
    delete:
      operationId: inboxes/remove-label
      tags:
        - Inboxes
      summary: Remove an existing inbox label
      description: Deletes the label and removes it from every thread that carries it.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: label_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Label ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveInboxLabelResponseSuccess'
  /inboxes/{inbox_id}/threads:
    get:
      operationId: inboxes/list-threads
      tags:
        - Inboxes
      summary: Retrieve a list of inbox threads
      description: >-
        Returns the threads in an inbox, most recently active first. A thread is
        a conversation made up of one or more emails. The `after` and `before`
        cursors take a thread ID, and only one of them can be passed. A date
        cursor returns a 422 validation_error. To find threads by text, sender,
        recipient, attachment, or date, use the search threads endpoint.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: folders
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - inbox
                - archive
                - spam
                - sent
                - trash
          description: >-
            Comma-separated folders to list, for example `inbox,sent`. Repeating
            the parameter returns a 422 validation_error. A thread is returned
            when any of its emails is in one of the folders, so a thread in
            `inbox` with an email you sent matches both `inbox` and `sent`.
            Defaults to `inbox`, or to `inbox,archive,sent` when `labels` is set.
            `spam` and `trash` are only included when you name them.
          example:
            - inbox
            - sent
        - name: labels
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              format: uuid
          description: >-
            Comma-separated label IDs. Returns threads with any of these labels.
            Up to 50 IDs. An ID that does not exist in the inbox returns a 404.
            Repeating the parameter returns a 422 validation_error.
          example:
            - 7f9c1d2e-4a6b-4c3d-8e15-9b0a7c6d5e34
        - name: read
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            `true` returns threads where every email is read. `false` returns
            threads with at least one unread email. Only the literal values
            `true` and `false` are accepted.
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationAfter'
        - $ref: '#/components/parameters/PaginationBefore'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInboxThreadsResponseSuccess'
  /inboxes/{inbox_id}/threads/search:
    get:
      operationId: inboxes/search-threads
      tags:
        - Inboxes
      summary: Search the threads of an inbox
      description: >-
        Finds threads by the text of their emails, who sent or received them,
        whether they have attachments, and their dates. Results are ordered by
        latest activity, newest first, and paginate like the list threads
        endpoint. Search can be up to about a minute behind new emails.
        Different parameters combine, so a thread must match all of them.
        `folders`, `labels`, and `read` apply to the thread. `query`, `from`,
        `to`, `cc`, `bcc`, `has_attachment`, `start_date`, and `end_date` must
        all match the same email in the thread. With a `query`, `folders=sent`
        also requires the matching email to be one the inbox sent.
        When more than 10,000 threads match, search covers the 10,000 with the newest matching email.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: >-
            Free text to search for in the subject, body, sender, recipients, and
            attachment names. Every word must match. Wrap words in double quotes
            to match an exact phrase. Start a word or quoted phrase with `-` to
            exclude it. Max 256 characters and 32 words.
          example: invoice -draft
        - name: from
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              type: string
          description: >-
            Comma-separated senders. Each value matches part of the sender's
            address or name, without case. Returns threads that match any of
            them. Up to 20 values.
            Repeating the parameter returns a 422 validation_error.
          example:
            - isabella@example.com
            - carolina@example.com
        - name: to
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              type: string
          description: Comma-separated recipients, matched the same way as `from`. Up to 20 values. Repeating the parameter returns a 422 validation_error.
        - name: cc
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              type: string
          description: Comma-separated CC recipients, matched the same way as `from`. Up to 20 values. Repeating the parameter returns a 422 validation_error.
        - name: bcc
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              type: string
          description: Comma-separated BCC recipients, matched the same way as `from`. Up to 20 values. Repeating the parameter returns a 422 validation_error.
        - name: has_attachment
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            `true` matches emails with an attachment. `false` matches emails
            without one. Only the literal values `true` and `false` are accepted.
        - name: start_date
          in: query
          required: false
          schema:
            type: string
          description: >-
            Matches emails sent on or after this date. Accepts a date like
            `2026-09-01` or an ISO 8601 timestamp, in UTC unless the timestamp
            has an offset.
          example: '2026-09-01'
        - name: end_date
          in: query
          required: false
          schema:
            type: string
          description: >-
            Matches emails sent on or before this date. Same formats as
            `start_date`. A date covers that whole day, so
            `start_date=2026-09-01&end_date=2026-09-30` covers all of September.
            A timestamp is used as given. An `end_date` before `start_date`
            returns a 422 validation_error.
          example: '2026-09-30'
        - name: folders
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - inbox
                - archive
                - spam
                - sent
                - trash
          description: >-
            Comma-separated folders to search, for example `inbox,sent`.
            Repeating the parameter returns a 422 validation_error. A thread is
            returned when any of its emails is in one of the folders. Defaults to
            `inbox`, or to `inbox,archive,sent` when `labels` is set. `spam` and
            `trash` are only included when you name them.
          example:
            - inbox
            - sent
        - name: labels
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              format: uuid
          description: >-
            Comma-separated label IDs. Returns threads with any of these labels.
            Up to 50 IDs. An ID that does not exist in the inbox returns a 404.
            Repeating the parameter returns a 422 validation_error.
          example:
            - 7f9c1d2e-4a6b-4c3d-8e15-9b0a7c6d5e34
        - name: read
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            `true` returns threads where every email is read. `false` returns
            threads with at least one unread email. Only the literal values
            `true` and `false` are accepted.
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationAfter'
        - $ref: '#/components/parameters/PaginationBefore'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchInboxThreadsResponseSuccess'
  /inboxes/{inbox_id}/threads/{thread_id}:
    get:
      operationId: inboxes/get-thread
      tags:
        - Inboxes
      summary: Retrieve a single inbox thread
      description: >-
        Returns the thread summary. The emails in the thread are listed with
        the list thread emails endpoint.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Thread ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInboxThreadResponseSuccess'
    patch:
      operationId: inboxes/update-thread
      tags:
        - Inboxes
      summary: Update an existing inbox thread
      description: >-
        Marks a thread read or unread, moves it to a folder, or applies a label.
        At least one of `read`, `folder`, or `label_id` is required. Moving a
        thread out of `trash` restores it and clears its deletion deadline.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Thread ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInboxThreadOptions'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInboxThreadResponseSuccess'
    delete:
      operationId: inboxes/remove-thread
      tags:
        - Inboxes
      summary: Remove an existing inbox thread
      description: >-
        Moves the thread to `trash` and schedules it for deletion in 30 days.
        This is reversible. To restore the thread, update its `folder` to
        `inbox`, `archive`, or `spam`, which also clears the deletion deadline.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Thread ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveInboxThreadResponseSuccess'
  /inboxes/{inbox_id}/threads/{thread_id}/emails:
    get:
      operationId: inboxes/list-thread-emails
      tags:
        - Inboxes
      summary: Retrieve a list of thread emails
      description: >-
        Returns the messages of a thread, oldest first. Pass the `id` of the
        last message as `after` to get the next, newer page. Pass the `id` of
        the first message as `before` to get the previous, older page. You
        cannot combine `after` and `before`.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Thread ID.
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationAfter'
        - $ref: '#/components/parameters/PaginationBefore'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInboxThreadEmailsResponseSuccess'
  /inboxes/{inbox_id}/threads/{thread_id}/emails/{email_id}:
    get:
      operationId: inboxes/get-thread-email
      tags:
        - Inboxes
      summary: Retrieve a single thread email
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Thread ID.
        - name: email_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Email ID, as returned in `data[].id` by the list thread emails endpoint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInboxThreadEmailResponseSuccess'
  /inboxes/{inbox_id}/threads/{thread_id}/emails/{email_id}/reply:
    post:
      operationId: inboxes/reply-thread-email
      tags:
        - Inboxes
      summary: Reply to a thread email
      description: >-
        Sends a reply from the inbox address right away, with no stored draft.
        The `to` recipients come from the message you reply to. For a message
        the inbox received, the reply goes to its `Reply-To` addresses, or to
        its sender when it has no `Reply-To`. For a message the inbox sent, the
        reply goes to that message's `to` recipients. Set `reply_all` to also
        copy the other recipients of the message. The reply threads under the
        message through the `In-Reply-To` and `References` headers.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Thread ID.
        - name: email_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Email ID of the message to reply to, as returned in `data[].id` by the list thread emails endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyInboxThreadEmailOptions'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyInboxThreadEmailResponseSuccess'
  /inboxes/{inbox_id}/threads/{thread_id}/emails/{email_id}/forward:
    post:
      operationId: inboxes/forward-thread-email
      tags:
        - Inboxes
      summary: Forward a thread email
      description: >-
        Forwards a message from the inbox address right away, with no stored
        draft. The original message is quoted under a forwarded-message banner,
        below the optional `html` or `text` note. The attachments of the original
        message are sent with the forward. The request fails when they exceed 10
        files or 25 MB in total.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Thread ID.
        - name: email_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Email ID of the message to forward, as returned in `data[].id` by the list thread emails endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardInboxThreadEmailOptions'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForwardInboxThreadEmailResponseSuccess'
  /inboxes/{inbox_id}/drafts:
    get:
      operationId: inboxes/list-drafts
      tags:
        - Inboxes
      summary: Retrieve a list of drafts
      description: >-
        Returns the unsent drafts on the inbox, most recently updated first.
        The `after` and `before` cursors take a Draft ID from the current page.
        A cursor that is not an unsent draft on this inbox returns a 404.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationAfter'
        - $ref: '#/components/parameters/PaginationBefore'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInboxDraftsResponseSuccess'
    post:
      operationId: inboxes/create-draft
      tags:
        - Inboxes
      summary: Create a draft
      description: >-
        Creates an unsent draft on the inbox. Omit `thread_id` and
        `reply_to_email_id` for a draft that starts a new thread. Pass both
        together for a reply draft in an existing thread. A reply draft
        without `to` is addressed to the sender of the email it replies to, or
        to its Reply-To when set. Send `to: []` to leave it empty.
        At least one of `to`, `cc`, `bcc`, `subject`, `text` or `html` must be
        non-empty. The combined recipients of `to`, `cc` and
        `bcc` cannot exceed 50. Returns 201 for a new draft. Only one unsent
        reply draft can target an email, so a reply draft request for an
        email that already has one returns 200 with the existing draft.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInboxDraftOptions'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInboxDraftResponseSuccess'
        '200':
          description: The reply draft for this email already exists. The response body is the existing draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInboxDraftResponseSuccess'
  /inboxes/{inbox_id}/drafts/{draft_id}:
    get:
      operationId: inboxes/get-draft
      tags:
        - Inboxes
      summary: Retrieve a single draft
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Draft ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInboxDraftResponseSuccess'
    patch:
      operationId: inboxes/update-draft
      tags:
        - Inboxes
      summary: Update an existing draft
      description: >-
        Updates the content of an unsent draft. Omitted fields are left
        unchanged. Send at least one of `to`, `cc`, `bcc`, `subject`, `text` or
        `html`. A request that sets `text` or `html` replaces the whole body.
        The body part you omit from that request becomes `null`. The merged draft must still
        contain at least one non-empty field, and its combined recipients
        cannot exceed 50. A draft that was already sent, or that changed
        during the request, returns a 409.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Draft ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInboxDraftOptions'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInboxDraftResponseSuccess'
    delete:
      operationId: inboxes/remove-draft
      tags:
        - Inboxes
      summary: Remove an existing draft
      description: >-
        Discards an unsent draft. A draft that was already sent, or that
        changed during the request, returns a 409.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Draft ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveInboxDraftResponseSuccess'
  /inboxes/{inbox_id}/drafts/{draft_id}/send:
    post:
      operationId: inboxes/send-draft
      tags:
        - Inboxes
      summary: Send a draft
      description: >-
        Sends the draft from the inbox address. A reply draft is sent in its
        thread. A draft without a thread starts a new thread. The draft must
        have at least one recipient, or the request returns a 422. A draft that
        was already sent returns a 409. The request takes no body.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Draft ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendInboxDraftResponseSuccess'
webhooks:
  email.sent:
    post:
      summary: Email sent
      description: Occurs whenever the API request was successful. Resend will attempt to deliver the message to the recipient's mail server.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSentEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  email.delivered:
    post:
      summary: Email delivered
      description: Occurs whenever Resend successfully delivered the email to the recipient's mail server.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailDeliveredEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  email.delivery_delayed:
    post:
      summary: Email delivery delayed
      description: Occurs whenever the email couldn't be delivered due to a temporary issue, such as the recipient's inbox being full or the receiving server experiencing a transient issue.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailDeliveryDelayedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  email.bounced:
    post:
      summary: Email bounced
      description: Occurs whenever the recipient's mail server permanently rejected the email.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBouncedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  email.complained:
    post:
      summary: Email complained
      description: Occurs whenever the email was successfully delivered, but the recipient marked it as spam.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailComplainedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  email.opened:
    post:
      summary: Email opened
      description: Occurs whenever the recipient opened the email. Requires open tracking to be enabled.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOpenedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  email.clicked:
    post:
      summary: Email clicked
      description: Occurs whenever the recipient clicks on an email link. Requires click tracking to be enabled.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailClickedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  email.failed:
    post:
      summary: Email failed
      description: Occurs whenever the email failed to send due to an error such as invalid recipients, API key problems, domain verification issues, email quota limits, or other sending failures.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailFailedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  email.scheduled:
    post:
      summary: Email scheduled
      description: Occurs whenever the email is scheduled to be sent.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailScheduledEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  email.suppressed:
    post:
      summary: Email suppressed
      description: Occurs whenever the email is suppressed by Resend, such as when the recipient's address is on the account-level suppression list.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSuppressedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  email.received:
    post:
      summary: Email received
      description: Occurs whenever Resend successfully receives an inbound email on a receiving domain.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailReceivedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  contact.created:
    post:
      summary: Contact created
      description: 'Occurs whenever a contact was successfully created. Note: when importing multiple contacts via CSV, this event is not triggered.'
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  contact.updated:
    post:
      summary: Contact updated
      description: Occurs whenever a contact was successfully updated.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  contact.deleted:
    post:
      summary: Contact deleted
      description: Occurs whenever a contact was successfully deleted.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactDeletedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  contact.topics.updated:
    post:
      summary: Contact topics updated
      description: Occurs whenever a contact's topic subscriptions were updated.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactTopicsUpdatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  domain.created:
    post:
      summary: Domain created
      description: Occurs when a domain was successfully created.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  domain.updated:
    post:
      summary: Domain updated
      description: Occurs when a domain was successfully updated.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainUpdatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  domain.deleted:
    post:
      summary: Domain deleted
      description: Occurs when a domain was successfully deleted.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainDeletedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  suppression.added:
    post:
      summary: Suppression added
      description: Occurs whenever an email address was added to the suppression list.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionAddedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  suppression.removed:
    post:
      summary: Suppression removed
      description: Occurs whenever an email address was removed from the suppression list.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionRemovedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  topic.created:
    post:
      summary: Topic created
      description: Occurs whenever a topic was successfully created.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicCreatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  topic.updated:
    post:
      summary: Topic updated
      description: Occurs whenever a topic was successfully updated.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicUpdatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  topic.deleted:
    post:
      summary: Topic deleted
      description: Occurs whenever a topic was successfully deleted.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicDeletedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.created:
    post:
      summary: Inbox created
      description: Occurs whenever an inbox was created.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxCreatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.updated:
    post:
      summary: Inbox updated
      description: Occurs whenever the settings of an inbox changed.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxUpdatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.deleted:
    post:
      summary: Inbox deleted
      description: Occurs whenever an inbox was deleted. The payload carries only the inbox ID.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxDeletedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.thread.created:
    post:
      summary: Inbox thread created
      description: Occurs whenever the first email of a thread landed in an inbox, inbound or outbound. The `source` is always `system`, because the email pipeline sends this event, even when the API or an agent sent the email.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxThreadCreatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.email.received:
    post:
      summary: Inbox email received
      description: Occurs whenever an inbound email was added to a thread. The `source` is always `system`.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxEmailReceivedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.email.sent:
    post:
      summary: Inbox email sent
      description: Occurs whenever an outbound email was accepted for delivery and added to a thread. The `source` is always `system`. When the email comes from a draft, `inbox.draft.sent` fires first, from the send call.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxEmailSentEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.thread.folder.updated:
    post:
      summary: Inbox thread folder updated
      description: Occurs whenever a thread moved between folders. Moving a thread to a label can send both this event and `inbox.thread.labels.updated` for the same thread.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxThreadFolderUpdatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.thread.assigned:
    post:
      summary: Inbox thread assigned
      description: Occurs whenever a thread was assigned or reassigned.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxThreadAssignedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.thread.unassigned:
    post:
      summary: Inbox thread unassigned
      description: Occurs whenever a thread was unassigned.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxThreadUnassignedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.thread.labels.updated:
    post:
      summary: Inbox thread labels updated
      description: Occurs whenever a label was applied to or removed from a thread. One event carries one label. Deleting a label does not send this event for the threads that had it.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxThreadLabelsUpdatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.draft.created:
    post:
      summary: Inbox draft created
      description: Occurs whenever a draft was created, standalone or reply.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxDraftCreatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.draft.updated:
    post:
      summary: Inbox draft updated
      description: Occurs whenever a draft was edited.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxDraftUpdatedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.draft.sent:
    post:
      summary: Inbox draft sent
      description: Occurs whenever a draft was sent. This event fires from the send call. `inbox.email.sent` follows once the email is accepted for delivery.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxDraftSentEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
  inbox.draft.deleted:
    post:
      summary: Inbox draft deleted
      description: Occurs whenever a draft was discarded. The draft is already gone, so the payload has no `draft` object.
      tags:
        - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxDraftDeletedEvent'
      responses:
        '2XX':
          description: Return any 2xx status code to acknowledge receipt of the event.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    PaginationLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Number of items to return.
    PaginationAfter:
      in: query
      name: after
      required: false
      schema:
        type: string
      description: Return items after this cursor.
    PaginationBefore:
      in: query
      name: before
      required: false
      schema:
        type: string
      description: Return items before this cursor.
  schemas:
    SendEmailRequest:
      type: object
      required:
        - from
        - to
        - subject
      properties:
        from:
          type: string
          description: Sender email address. To include a friendly name, use the format "Your Name <sender@domain.com>".
        to:
          description: Recipient email address. For multiple addresses, send as an array of strings. Max 50.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              minItems: 1
              maxItems: 50
        subject:
          type: string
          description: Email subject.
        bcc:
          description: Bcc recipient email address. For multiple addresses, send as an array of strings.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        cc:
          description: Cc recipient email address. For multiple addresses, send as an array of strings.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        reply_to:
          description: Reply-to email address. For multiple addresses, send as an array of strings.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        html:
          type: string
          description: The HTML version of the message.
        text:
          type: string
          description: The plain text version of the message.
        template:
          allOf:
            - $ref: '#/components/schemas/EmailTemplateInput'
            - description: Use a published template to send the email. If provided, do not include html or text.
        headers:
          type: object
          description: Custom headers to add to the email.
        scheduled_at:
          type: string
          description: Schedule email to be sent later. The date should be in ISO 8601 format.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        topic_id:
          type: string
          description: The topic ID to scope the email to. If the recipient is a contact and opted-in to the topic, the email is sent. If opted-out, the email is not sent. If the recipient is not a contact, the email is sent if the topic's default subscription is opt_in.
    Attachment:
      type: object
      properties:
        content:
          type: string
          format: binary
          description: Content of an attached file.
        filename:
          type: string
          description: Name of attached file.
        path:
          type: string
          description: Path where the attachment file is hosted
        content_type:
          type: string
          description: Optional content type for the attachment, if not set it will be derived from the filename property
        content_id:
          type: string
          description: Content ID for embedding inline images using cid references (e.g., cid:image001).
    Tag:
      type: object
      properties:
        name:
          type: string
          description: The name of the email tag. It can only contain ASCII letters (a–z, A–Z), numbers (0–9), underscores (_), or dashes (-). It can contain no more than 256 characters.
        value:
          type: string
          description: The value of the email tag.It can only contain ASCII letters (a–z, A–Z), numbers (0–9), underscores (_), or dashes (-). It can contain no more than 256 characters.
    EmailTemplateInput:
      type: object
      properties:
        id:
          type: string
          description: The id of the published email template.
        variables:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
          description: Template variables object with key/value pairs.
          example:
            variableName: 'Sign up now'
            variableName2: 123
      required:
        - id
    SendEmailResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the sent email.
    UpdateEmailOptions:
      type: object
      properties:
        scheduled_at:
          type: string
          description: Schedule email to be sent later. The date should be in ISO 8601 format.
    ShareEmailOptions:
      type: object
      properties:
        expires_in:
          type: string
          description: How long the link stays valid for, as a duration like `10m`, `2 hours`, or `1 day`. Defaults to `48h` and cannot exceed 48 hours.
    ShareEmailResponse:
      type: object
      properties:
        object:
          type: string
          description: The type of object.
          example: 'email'
        id:
          type: string
          description: The ID of the email.
          example: '4ef9a417-02e9-4d39-ad75-9611e0fcc33c'
        url:
          type: string
          description: The shareable link, valid until it expires.
          example: 'https://resend.com/shared?token=eyJhbGciOiJIUzI1NiJ9...'
    Email:
      type: object
      properties:
        object:
          type: string
          description: The type of object.
          example: 'email'
        id:
          type: string
          description: The ID of the email.
          example: '4ef9a417-02e9-4d39-ad75-9611e0fcc33c'
        message_id:
          type: string
          description: The Message-ID header value of the email.
          example: '<202301010000.4ef9a417@email.example.com>'
        to:
          type: array
          items:
            type: string
            description: The email addresses of the recipients.
          example: ['delivered@resend.dev']
        from:
          type: string
          description: The email address of the sender.
          example: 'Acme <onboarding@resend.dev>'
        created_at:
          type: string
          description: The date and time the email was created.
          example: '2023-04-03 22:13:42.674981+00'
        subject:
          type: string
          description: The subject line of the email.
          example: 'Hello World'
        html:
          type: string
          description: The HTML body of the email.
          example: 'Congrats on sending your <strong>first email</strong>!'
        text:
          type: string
          description: The plain text body of the email.
        bcc:
          type: array
          items:
            type: string
          description: The email addresses of the blind carbon copy recipients.
        cc:
          type: array
          items:
            type: string
          description: The email addresses of the carbon copy recipients.
        reply_to:
          type: array
          items:
            type: string
          description: The email addresses to which replies should be sent.
        last_event:
          type: string
          description: The status of the email.
          enum:
            - bounced
            - canceled
            - clicked
            - complained
            - delivered
            - delivery_delayed
            - failed
            - opened
            - queued
            - scheduled
            - sent
            - suppressed
          example: 'delivered'
    ListEmailsResponse:
      type: object
      properties:
        object:
          type: string
          description: Type of the response object.
          example: 'list'
        has_more:
          type: boolean
          description: Indicates if there are more results available.
          example: false
        data:
          type: array
          description: Array containing email information.
          items:
            $ref: '#/components/schemas/Email'
    GetEmailsMetricsResponse:
      type: object
      properties:
        object:
          type: string
          description: Type of the response object.
          example: 'metrics'
        start_date:
          type: string
          description: The start of the requested date range, as an ISO 8601 datetime.
          example: '2026-07-01T00:00:00.000Z'
        end_date:
          type: string
          description: The end of the requested date range, as an ISO 8601 datetime.
          example: '2026-07-08T00:00:00.000Z'
        metrics:
          type: array
          description: The metrics included in the response.
          items:
            type: string
        dimensions:
          type: array
          description: The dimensions the response is broken down by.
          items:
            type: string
            enum:
              - period
              - domain
              - email
              - broadcast
        granularity:
          type: string
          enum:
            - hourly
            - daily
            - weekly
            - monthly
          description: The bucket size used when `period` is in `dimensions`.
        totals:
          type: object
          description: The requested metrics, totaled over the whole date range.
          additionalProperties:
            type: number
        data:
          type: array
          description: One row per unique combination of the requested `dimensions`. Omitted when `dimensions` is empty.
          items:
            $ref: '#/components/schemas/EmailMetricsDataRow'
    EmailMetricsDataRow:
      type: object
      description: A single breakdown row. Which dimension fields are present depends on the requested `dimensions`; which metric fields are present depends on the requested `metrics`.
      properties:
        period:
          type: string
          description: Present when `period` is in `dimensions`.
        domain_id:
          type: string
          format: uuid
          description: Present when `domain` is in `dimensions`.
        domain_name:
          type: string
          description: Present when `domain` is in `dimensions`.
        email_id:
          type: string
          format: uuid
          description: Present when `email` is in `dimensions`.
        broadcast_id:
          type: string
          format: uuid
          description: Present when `broadcast` is in `dimensions`.
        broadcast_name:
          type: string
          description: Present when `broadcast` is in `dimensions`.
      additionalProperties:
        type: number
    GetUsageResponseSuccess:
      type: object
      properties:
        object:
          type: string
          description: The type of object.
          example: 'usage'
        emails:
          type: object
          properties:
            daily:
              type: object
              properties:
                used:
                  type: integer
                  description: Emails sent and received in the current day.
                limit:
                  type: [integer, "null"]
                  description: The daily plan limit, or `null` when the account has a monthly sending subscription.
                sent:
                  type: integer
                  description: Emails sent today.
                received:
                  type: integer
                  description: Emails received today.
                resets_at:
                  type: string
                  description: When the daily counter resets, as an ISO 8601 datetime.
            monthly:
              type: object
              properties:
                used:
                  type: integer
                  description: Emails sent and received in the current billing period.
                limit:
                  type: integer
                  description: The monthly plan limit.
                sent:
                  type: integer
                  description: Emails sent this billing period.
                received:
                  type: integer
                  description: Emails received this billing period.
                resets_at:
                  type: string
                  description: When the monthly counter resets, as an ISO 8601 datetime.
        contacts:
          type: object
          properties:
            used:
              type: integer
              description: Contacts currently stored.
            limit:
              type: integer
              description: The plan limit.
        segments:
          type: object
          properties:
            used:
              type: integer
              description: Segments currently created.
            limit:
              type: [integer, "null"]
              description: The plan limit, or `null` when the account has a contacts subscription.
        broadcasts:
          type: object
          properties:
            used:
              type: integer
              description: Broadcasts sent.
            limit:
              type: 'null'
              description: Always `null`; broadcasts aren't limited.
        ai_credits:
          type: object
          properties:
            used:
              type: integer
              description: AI credits consumed in the current period.
            limit:
              type: [integer, "null"]
              description: The plan limit, or `null` when unlimited.
            next_increase_at:
              type: [string, "null"]
              description: When the AI credit balance next increases, as an ISO 8601 datetime, or `null` when unknown.
        automation_runs:
          type: object
          properties:
            used:
              type: integer
              description: Automation runs in the current billing period.
            limit:
              type: integer
              description: The plan limit.
            resets_at:
              type: string
              description: When the counter resets, as an ISO 8601 datetime.
        domains:
          type: object
          properties:
            used:
              type: integer
              description: Domains currently added.
            limit:
              type: [integer, "null"]
              description: The plan limit, or `null` when unlimited.
        rate_limit:
          type: object
          properties:
            limit:
              type: integer
              description: The number of requests allowed per `duration`.
            duration:
              type: string
              description: The rate-limit window, e.g. `'1000ms'`.
    CreateBatchEmailsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: The ID of the sent email.
    DomainCapabilities:
      type: object
      description: Configure the domain capabilities for sending and receiving emails. At least one capability must be enabled.
      properties:
        sending:
          type: string
          enum:
            - enabled
            - disabled
          description: Enable or disable sending emails from this domain.
        receiving:
          type: string
          enum:
            - enabled
            - disabled
          description: Enable or disable receiving emails to this domain.
    CreateDomainRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the domain you want to create.
        region:
          type: string
          enum:
            - us-east-1
            - eu-west-1
            - sa-east-1
            - ap-northeast-1
          default: us-east-1
          description: The region where emails will be sent from. Possible values are us-east-1 | eu-west-1 | sa-east-1 | ap-northeast-1
        custom_return_path:
          type: string
          description: For advanced use cases, choose a subdomain for the Return-Path address. Defaults to 'send' (i.e., send.yourdomain.tld).
        open_tracking:
          type: boolean
          description: Track the open rate of each email.
        click_tracking:
          type: boolean
          description: Track clicks within the body of each HTML email.
        tls:
          type: string
          enum:
            - opportunistic
            - enforced
          default: opportunistic
          description: TLS mode. Opportunistic attempts secure connection but falls back to unencrypted. Enforced requires TLS or email won't be sent.
        capabilities:
          $ref: '#/components/schemas/DomainCapabilities'
        tracking_subdomain:
          type: string
          description: The subdomain to use for click and open tracking.
    CreateDomainResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the domain.
        name:
          type: string
          description: The name of the domain.
        created_at:
          type: string
          description: The date and time the domain was created.
          example: '2023-10-06 23:47:56.678+00'
        status:
          type: string
          enum:
            - pending
            - verified
            - failed
            - not_started
            - partially_verified
            - partially_failed
          description: The status of the domain.
        capabilities:
          $ref: '#/components/schemas/DomainCapabilities'
        records:
          type: array
          items:
            $ref: '#/components/schemas/DomainRecord'
        region:
          type: string
          description: The region where the domain is hosted.
        open_tracking:
          type: boolean
          description: Whether open tracking is enabled for this domain.
        click_tracking:
          type: boolean
          description: Whether click tracking is enabled for this domain.
        tracking_subdomain:
          type: string
          description: The subdomain used for click and open tracking.
    UpdateDomainOptions:
      type: object
      properties:
        open_tracking:
          type: boolean
          description: Track the open rate of each email.
        click_tracking:
