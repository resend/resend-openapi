          example: Steve Wozniak <steve@acme.com>
        to:
          type: array
          items:
            type: string
          description: The recipients of the email.
          example:
            - support@acme.com
        cc:
          type: array
          items:
            type: string
          description: The CC recipients of the email.
        bcc:
          type: array
          items:
            type: string
          description: The BCC recipients of the email.
        reply_to:
          type: array
          items:
            type: string
          description: The Reply-To addresses.
        subject:
          type: [string, "null"]
          description: The subject of the email.
