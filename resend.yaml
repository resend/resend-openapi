  /inboxes:
    post:
      operationId: inboxes/create
      tags:
        - Inboxes
      summary: Create an inbox
      description: >-
        Creates an inbox that sends and receives email at an address on one of
        your domains. The domain must belong to the team. Without `forwarding`,
        the domain must have receiving enabled, with DKIM and SPF verified and
        the inbound MX record verified or pending. With `forwarding` set to
        `true`, the domain only needs DKIM and SPF verified for sending, and
        Resend generates a `receiving_address` on the team inbound domain. A
        domain that does not meet these rules returns a 422 validation_error.
        An address or receiving address that is already in use returns a 409.
        A team that has reached the inbox limit of its plan returns a 403
        validation_error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInboxOptions'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInboxResponseSuccess'
    get:
      operationId: inboxes/list
      tags:
        - Inboxes
      summary: Retrieve a list of inboxes
      description: >-
        Returns the inboxes of the team, newest first. The list items carry
        fewer fields than a single inbox. Retrieve an inbox to get all its
        fields.
      parameters:
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationAfter'
        - $ref: '#/components/parameters/PaginationBefore'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInboxesResponseSuccess'
  /inboxes/{inbox_id}:
    get:
      operationId: inboxes/get
      tags:
        - Inboxes
      summary: Retrieve a single inbox by ID or email address
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
          description: >-
            The Inbox ID or the inbox email address, such as
            `support@acme.com`. A value that contains `@` must be a valid email
            address, and the match is case-insensitive. Any other value must be
            a UUID.
          example: b3e2b2b6-3f0e-4c8e-9ad3-2f43a1e2c7f1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInboxResponseSuccess'
    patch:
      operationId: inboxes/update
      tags:
        - Inboxes
      summary: Update an existing inbox
      description: >-
        Updates the internal name of the inbox or the name recipients see when
        mail is sent from it. At least one of `name` or `from_name` is
        required.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
          example: b3e2b2b6-3f0e-4c8e-9ad3-2f43a1e2c7f1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInboxOptions'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInboxResponseSuccess'
    delete:
      operationId: inboxes/remove
      tags:
        - Inboxes
      summary: Remove an existing inbox
      description: >-
        Removes the inbox. An inbox that does not exist or was already removed
        returns a 404 not_found.
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Inbox ID. An email address is not accepted.
          example: b3e2b2b6-3f0e-4c8e-9ad3-2f43a1e2c7f1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveInboxResponseSuccess'
  /inboxes/{inbox_id}/agent:
    get:
      operationId: inboxes/get-agent
      tags:
        - Inboxes
      summary: Retrieve the agent settings for an inbox
      description: >-
        Returns the agent settings of the inbox. An inbox without a configured
        agent returns empty settings: `instructions` and `tone` are null and
        `enabled_actions` is an empty array.
      parameters:
        - name: inbox_id
