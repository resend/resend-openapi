            highlights:
              type: object
              description: >-
                Where `query` matched the email in `matched_email_id`, as text fragments with each match wrapped in `**`. Only keys with a match are present. An empty object when there is no `query`.
              properties:
                subject:
                  type: array
                  items:
                    type: string
                body:
                  type: array
                  items:
                    type: string
                from:
                  type: array
                  items:
                    type: string
                to:
                  type: array
                  items:
                    type: string
                cc:
                  type: array
                  items:
                    type: string
                bcc:
                  type: array
                  items:
                    type: string
                attachments:
                  type: array
                  items:
