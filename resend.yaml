          type: string
          format: uuid
          description: The ID of the draft.
          example: c3a1e8b4-2d5f-4a7c-9e10-6b8d7f5a4c32
        type:
          type: string
          enum:
            - standalone
            - reply
          description: '`reply` when the draft replies to an email in an existing thread. `standalone` when the draft starts a new thread.'
          example: standalone
        to:
          type: [array, "null"]
          items:
            type: string
          description: The recipients. `null` or empty when no recipients are set.
          example:
            - ada@example.org
        cc:
          type: array
          items:
            type: string
          description: The CC recipients.
          example: []
        bcc:
          type: array
          items:
            type: string
          description: The BCC recipients.
          example: []
        subject:
          type: [string, "null"]
          description: The subject.
          example: Refund for order 1041
        snippet:
          type: [string, "null"]
          description: A short preview of the body.
          example: Refund issued for order 1041.
        thread_id:
          type: [string, "null"]
          format: uuid
          description: The Thread ID when the draft is a reply. `null` otherwise.
          example: null
        reply_to_email_id:
          type: [string, "null"]
          format: uuid
          description: The Email ID the draft replies to. `null` otherwise.
          example: null
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the draft was last saved.
          example: '2026-08-05T14:12:04.110Z'
    ListInboxDraftsResponseSuccess:
      type: object
      required:
        - object
        - has_more
        - data
      properties:
        object:
          type: string
          description: Type of the response object.
          example: list
        has_more:
          type: boolean
          description: Indicates if there are more results available.
          example: false
        data:
          type: array
          description: The unsent drafts on this page, most recently updated first.
          items:
            $ref: '#/components/schemas/InboxDraftListItem'
    CreateInboxDraftOptions:
      type: object
      description: >-
        At least one of `to`, `cc`, `bcc`, `subject`, `text` or `html` must be non-empty. The combined recipients of `to`, `cc` and `bcc` cannot exceed 50. `thread_id` and `reply_to_email_id` must be sent together or not at all.
      properties:
        to:
          description: >-
            The recipients. For multiple addresses, send an array of strings. Each value can include a friendly name, for example `Ada Lovelace <ada@example.org>`.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 50
            - type: 'null'
          example:
            - ada@example.org
        cc:
          description: The CC recipients. For multiple addresses, send an array of strings.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 50
            - type: 'null'
        bcc:
          description: The BCC recipients. For multiple addresses, send an array of strings.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 50
            - type: 'null'
        subject:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
          description: The subject. Max 2000 characters. A string that is only whitespace, or that contains a line break, is rejected.
          example: Refund for order 1041
        html:
          type: [string, "null"]
          description: The HTML body.
          example: <p>Refund issued for order 1041.</p>
        text:
          type: [string, "null"]
          description: The plain text body.
          example: Refund issued for order 1041.
        thread_id:
          type: string
          format: uuid
          description: The Thread ID to reply in. Must be sent with `reply_to_email_id`.
          example: 4d8e2a1c-9b3f-4c6d-8a21-3e5f7c9c0d12
        reply_to_email_id:
          type: string
          format: uuid
          description: >-
            The Email ID to reply to, as returned in `data[].id` by the list thread emails endpoint. Must be sent with `thread_id`.
          example: 5b1a9f47-2c8d-4e6f-9a03-1d2e3f4a5b60
    CreateInboxDraftResponseSuccess:
      $ref: '#/components/schemas/InboxDraft'
    GetInboxDraftResponseSuccess:
      $ref: '#/components/schemas/InboxDraft'
    UpdateInboxDraftOptions:
      type: object
      description: >-
        Send at least one of `to`, `cc`, `bcc`, `subject`, `text` or `html`. Omitted fields are left unchanged. Setting `text` or `html` replaces the whole body, so the body part you omit becomes `null`. The merged draft must contain at least one non-empty field, and its combined recipients cannot exceed 50.
      minProperties: 1
      properties:
        to:
          description: >-
            The recipients. For multiple addresses, send an array of strings. Each value can include a friendly name. Pass `null` to clear.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 50
            - type: 'null'
          example:
            - ada@example.org
        cc:
          description: The CC recipients. Pass `null` or `[]` to clear.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 50
            - type: 'null'
        bcc:
          description: The BCC recipients. Pass `null` or `[]` to clear.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 50
            - type: 'null'
        subject:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
          description: The subject. Max 2000 characters. Must not contain a line break. Pass `null` to clear.
          example: Refund issued for order 1041
        html:
          type: [string, "null"]
          description: The HTML body. Pass `null` to clear.
        text:
          type: [string, "null"]
          description: The plain text body. Pass `null` to clear.
