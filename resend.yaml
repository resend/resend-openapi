    InboxThread:
      type: object
      description: A thread as it appears in the list of an inbox's threads.
      required:
        - id
        - subject
        - from
        - to
        - cc
        - bcc
        - labels
        - message_count
        - has_attachment
        - has_draft
        - read
        - received_at
        - folder
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the thread.
          example: 4d8e2a1c-9b3f-4c6d-8a21-3e5f7c9c0d12
        subject:
          type: [string, "null"]
          description: The subject of the thread.
          example: Refund for order 1041
        from:
          type: [string, "null"]
          description: The sender email address. Can include the display name.
          example: ada@example.org
        to:
          type: array
          description: The recipients of the most recent email.
          items:
            type: string
          example:
            - support@example.com
        cc:
          type: array
          description: The CC recipients of the most recent email.
          items:
            type: string
          example: []
        bcc:
          type: array
          description: The BCC recipients of the most recent email.
          items:
            type: string
          example: []
        labels:
          type: array
          description: The labels attached to the thread.
          items:
            $ref: '#/components/schemas/InboxThreadLabel'
        message_count:
          type: integer
          description: The number of emails in the thread.
          example: 2
        has_attachment:
          type: boolean
          description: Whether any email in the thread has an attachment.
          example: true
        has_draft:
          type: boolean
          description: Whether the thread has an unsent draft.
          example: false
        read:
          type: boolean
          description: True only when every email in the thread is read.
          example: false
        received_at:
          type: string
          format: date-time
          description: Timestamp when the thread was last active.
          example: '2026-08-05T14:03:11.229Z'
        folder:
          type: string
          enum:
            - inbox
            - archive
            - spam
            - sent
            - trash
          description: >-
            The folder the thread is in. Every thread is in exactly one folder. `inbox` holds threads with at least one received email. `archive` and `spam` hold threads moved there. `trash` holds threads scheduled for deletion in 30 days. `sent` holds threads whose emails are all outbound, and is assigned automatically.
          example: inbox
    InboxThreadSearchResult:
      allOf:
