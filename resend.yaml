        - value
        - type
        - ttl
        - status
      properties:
        record:
          type: string
          enum:
            - SPF
            - DKIM
            - Receiving MX
            - Tracking
            - TrackingCAA
          description: The purpose of the DNS record (SPF and DKIM for sending; Receiving MX for inbound emails; Tracking and TrackingCAA for click and open tracking).
