    ReplyInboxThreadEmailOptions:
      type: object
      description: At least one of `html` or `text` must contain more than whitespace.
      properties:
        cc:
          description: >-
            CC recipient email address. For multiple addresses, send as an array of strings. Without `reply_all`, the reply copies only these addresses. With `reply_all`, these addresses are merged with the copied recipients, without duplicates. `cc` and `bcc` combined must be fewer than 50 addresses. After the `to` recipients are added, the reply cannot exceed 50 recipients.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 50
          example: ['billing@acme.com']
        bcc:
          description: >-
            BCC recipient email address. For multiple addresses, send as an array of strings. BCC recipients of the original message are never copied.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 50
          example: ['records@acme.com']
        html:
          type: string
          description: The HTML body of the reply.
          example: '<p>Refund issued for order 1041.</p>'
        text:
          type: string
          description: The plain-text body of the reply.
          example: Refund issued for order 1041.
        subject:
          type: string
          minLength: 1
          maxLength: 2000
          description: The subject of the reply. Cannot contain a line break. When omitted, the thread subject is used, prefixed with `Re:` if it does not already start with it.
          example: 'Re: Refund for order 1041'
        reply_all:
          type: boolean
          default: false
          description: >-
            Reply to everyone on the original message. The reply goes to the author of the message, or to its `Reply-To` addresses if it has any. The other `to` and `cc` recipients of the message are copied in `cc`. The inbox address is always excluded. For a message the inbox sent, the reply goes to that message's `to` recipients and copies its `cc` recipients.
          example: false
