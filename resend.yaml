          type: string
          description: DNS record value to be set.
        type:
          type: string
          enum:
            - MX
            - TXT
            - CNAME
            - CAA
          description: DNS record type.
        ttl:
          type: string
          description: Time to live for the DNS record (e.g., `Auto`, `60`).
        status:
          type: string
          enum:
            - pending
            - verified
            - failed
            - temporary_failure
            - not_started
